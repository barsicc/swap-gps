name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Постоянный ключ подписи из секретов, чтобы обновления ставились поверх
      - name: Подготовить ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/personal.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/personal.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет SIGNING_KEYSTORE_BASE64 не задан — APK подписан временным ключом"
          fi

      - name: Тесты
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Собрать APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/SwapGPS-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: SwapGPS-apk
          path: out/*.apk

      # Свежий APK всегда лежит в релизе «latest» — удобно качать прямо с телефона
      - name: Обновить релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Swap GPS — сборка #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Собрано автоматически из коммита ${GITHUB_SHA::7}. Скачайте APK ниже и установите."
